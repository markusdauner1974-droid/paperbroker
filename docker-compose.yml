# Portainer/Arcane stack for the paperbroker options screener.
#
# All environment-specific values are env variables (Arcane asks for
# them at deploy time / environment tab - no editing inside this file).
# Defaults via ${VAR:-default} so a bare deploy still works.
#
# Variables:
#   LAN_IP         QNAP LAN address, default 192.168.178.10
#   HOST_PORT      port reachable in the home network, default 8090
#   IMAGE          built by CI on master push (multi-arch amd64/arm64)
#   APP_PORT       port INSIDE the container (do not change; Dockerfile
#                  EXPOSE + healthcheck expect it)
#   FLASK_DEBUG    keep 0 (1 would expose the Werkzeug debugger - unsafe)
#   PAPERBROKER_TREND_MCP_URL / _TOKEN / _TIMEOUT_S
#                  optional trend provider (xang1234 MCP). Leave empty to
#                  run without trend input - that is the documented default
#                  and the app behaves exactly as if the variables were
#                  absent (no badge, no exception). The provider is only
#                  created when URL AND token are both set.

services:
  paperbroker-screener:
    image: ${IMAGE:-ghcr.io/markusdauner1974-droid/paperbroker-screener:latest}
    container_name: ${CONTAINER_NAME:-paperbroker-screener}
    restart: unless-stopped
    ports:
      # LAN-only binding (no port forward on the router)
      - "${LAN_IP:-192.168.178.10}:${HOST_PORT:-8090}:${APP_PORT:-8089}"
    volumes:
      - cboe_cache:/app/.cache
    environment:
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      # Trend provider (xang1234 MCP). All three default to empty, which
      # means "no trend input" - the same behaviour as before the provider
      # was wired. Set URL and TOKEN to switch the trend on.
      - PAPERBROKER_TREND_MCP_URL=${PAPERBROKER_TREND_MCP_URL:-}
      - PAPERBROKER_TREND_TOKEN=${PAPERBROKER_TREND_TOKEN:-}
      - PAPERBROKER_TREND_TIMEOUT_S=${PAPERBROKER_TREND_TIMEOUT_S:-}
      # Earnings source. "nasdaq" wires the key-free Nasdaq calendar; empty or
      # "off" leaves the Null adapter, which reports UNKNOWN and invents nothing.
      # The code default is OFF on purpose (a deploy must not silently start
      # calling an external service); this stack is the place that switches it on.
      - PAPERBROKER_EARNINGS_SOURCE=${PAPERBROKER_EARNINGS_SOURCE:-nasdaq}

volumes:
  cboe_cache: