name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (ivolat3 excluded - replaced by bs_model.py)
        run: |
          python -m pip install --upgrade pip
          grep -v '^ivolat3' requirements.txt > req.tmp && mv req.tmp requirements.txt
          pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest paperbroker/tests -q --tb=short