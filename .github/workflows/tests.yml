name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only by default.
permissions:
  contents: read

# Cancel superseded runs on the same branch (xang1234/stock-screener pattern).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run ruff from pyproject.toml
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.10'

  test:
    name: Test suite pytest 3.13
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (ivolat3 excluded - replaced by bs_model.py)
        run: |
          python -m pip install --upgrade pip
          grep -v '^ivolat3' requirements.txt > req.tmp && mv req.tmp requirements.txt
          pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest paperbroker/tests -q --tb=short